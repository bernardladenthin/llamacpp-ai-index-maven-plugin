# slf4j-simple defaults for the RUNNABLE FAT JAR only.
#
# This file is deliberately NOT under src/main/resources: that would put it into the
# published srcmorph-cli jar, where anyone embedding the CLI would find our logging
# configuration on their classpath. slf4j-simple reads whichever simplelogger.properties
# the classloader hands it first, so a consumer with their own file would get a coin flip.
# A library must not decide that; an application may, and the fat jar is the application.
#
# Every setting here is also overridable at launch with -Dorg.slf4j.simpleLogger.<key>.

# INFO keeps the plan/generate progress lines without the indexer's debug chatter.
org.slf4j.simpleLogger.defaultLogLevel=info

# stdout, not the slf4j-simple default of stderr: the CLI's own output belongs on the
# same stream as everything else a user pipes or redirects. The fat-jar smoke test greps
# for "Main#run end." on stdout, so this is load-bearing, not cosmetic.
org.slf4j.simpleLogger.logFile=System.out

# Wall-clock timestamps -- a run log without them cannot be correlated with anything.
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss.SSS

# Thread and short logger name, mirroring what the previous logback default emitted.
org.slf4j.simpleLogger.showThreadName=true
org.slf4j.simpleLogger.showShortLogName=true
