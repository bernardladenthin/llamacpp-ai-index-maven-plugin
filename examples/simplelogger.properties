# Example slf4j-simple configuration for srcmorph-cli, replacing the former
# logbackConfiguration.xml (the fat jar ships slf4j-simple now, because logback 1.4.0+ is
# Java 11 bytecode while this project targets Java 8 -- see the pin in the reactor pom).
#
# Two ways to use it:
#   * put a copy named simplelogger.properties FIRST on the classpath:
#       java -cp examples:srcmorph-cli-<version>-jar-with-dependencies.jar \
#            net.ladenthin.srcmorph.cli.Main examples/config_Plan.json
#   * or set the individual keys as system properties, which always win:
#       java -Dorg.slf4j.simpleLogger.defaultLogLevel=debug \
#            -jar srcmorph-cli-<version>-jar-with-dependencies.jar examples/config_Plan.json
#
# The fat jar carries these same defaults internally
# (srcmorph-cli/src/main/assembly-resources/simplelogger.properties), so this file is only
# needed to change them.

# debug shows the per-file indexer decisions; the shipped default is info.
org.slf4j.simpleLogger.defaultLogLevel=info

# stdout rather than slf4j-simple's default of stderr.
org.slf4j.simpleLogger.logFile=System.out

org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=true
org.slf4j.simpleLogger.showShortLogName=true
