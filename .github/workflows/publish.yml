name: Publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_to_central:
        description: "Deploy to Maven Central (snapshot if -SNAPSHOT, release if a vX.Y.Z tag)"
        type: boolean
        default: false

# Supersede an in-flight run when a PR branch is pushed again.
#
# Without this every push starts a full parallel pipeline and the older ones keep
# draining -- four were live at once during one session, which makes "what is CI
# saying right now" genuinely ambiguous and wastes a lot of runner time on results
# nobody will read.
#
# cancel-in-progress is deliberately scoped to pull_request ONLY. A push to main or
# to a v* tag is a release path: cancelling one midway could leave a partially
# published set of artifacts.
#
# cancel-in-progress: false is NOT sufficient on its own to protect a release run.
# GitHub cancels a *pending* run whenever a newer run joins the same group behind an
# in-progress one -- that rule is independent of cancel-in-progress. So with a plain
# `workflow-ref` group, a queued `publish_to_central` dispatch on main could be
# silently dropped by a later push to main, both sharing `Publish-refs/heads/main`.
# Giving every non-PR run its own group (via the unique run_id) means such a run is
# never queued behind a sibling and therefore can never be cancelled, while PR runs
# still share a group per ref and supersede each other as intended.
#
# One-time effect when this expression changes: GitHub reads `concurrency` from the
# workflow file at each run's own ref, so a run started before the change sits in the
# old group and a run started after it sits in the new one. They are different groups,
# so the new push does NOT supersede the in-flight old run -- exactly once, on the
# commit that lands this. It self-heals from the next push on. Expect the same overlap
# when porting this to a sibling repo; it is not a sign the expression is wrong.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Start gate — single cancellable abort window before the pipeline starts.
  # The wait duration lives in the `startgate` GitHub Environment (Settings →
  # Environments → startgate → Wait timer).
  # ---------------------------------------------------------------------------
  startgate:
    name: Start gate (abort window)
    runs-on: ubuntu-latest
    environment: startgate
    steps:
      - run: echo "Start gate elapsed — proceeding with pipeline."

  # ---------------------------------------------------------------------------
  # GPG signing-key preflight (standalone, no `needs:` — runs in parallel at the
  # very start on every trigger). Reproduces what maven-gpg-plugin does at deploy
  # time so a bad/expired key or wrong passphrase is caught in ~20s instead of
  # failing the publish stage. Declares `environment: maven-central` so it reads
  # the SAME GPG_PRIVATE_KEY / GPG_PASSPHRASE secret the publish jobs use.
  #
  # It is EXPECTED to go RED on refs where the secret is not delivered — fork PRs
  # and other contributors' branches (secrets are withheld there). That red is
  # the intended signal: "this ref cannot sign a release", not a regression.
  #
  # SECURITY: this job NEVER prints secret material. It imports the key into an
  # ephemeral keyring, prints only PUBLIC key metadata (key id, fingerprint,
  # owner UID, algorithm, created/expiry — all of which live on public
  # keyservers), and validates the passphrase by producing + verifying a
  # throwaway signature. The passphrase is passed on fd 3 (never argv, never a
  # log line), `set -x` is deliberately never enabled, and the passphrase is
  # additionally `::add-mask::`ed.
  # ---------------------------------------------------------------------------
  verify-signing-key:
    name: Verify GPG signing key (no secrets printed)
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - name: Import key + run sign/verify self-test (prints only PUBLIC metadata)
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail   # NOTE: deliberately NO `set -x` — it would echo the passphrase.

          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::GPG_PRIVATE_KEY is empty for this run. Either the secret is not set, or it is scoped to a different environment/branch than 'maven-central' on this ref. Nothing to verify."
            exit 1
          fi
          # Defensive: even though we never print it, register the passphrase as a
          # masked value so any accidental echo downstream is redacted.
          if [ -n "${GPG_PASSPHRASE:-}" ]; then echo "::add-mask::${GPG_PASSPHRASE}"; fi

          echo "gpg: $(gpg --version | head -n1)"

          # Ephemeral, private keyring; removed on exit.
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          cleanup() { gpgconf --kill gpg-agent >/dev/null 2>&1 || true; rm -rf "$GNUPGHOME"; }
          trap cleanup EXIT

          echo "== Import private key into an ephemeral keyring (key via stdin, never argv) =="
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import

          COLONS="$(gpg --list-secret-keys --with-colons --fixed-list-mode)"
          SECCOUNT="$(printf '%s\n' "$COLONS" | awk -F: '$1=="sec"{n++} END{print n+0}')"
          echo "Secret keys imported: $SECCOUNT"
          if [ "$SECCOUNT" -lt 1 ]; then
            echo "::error::No secret key was imported — GPG_PRIVATE_KEY is not a valid armored secret key (check that the secret contains the full -----BEGIN PGP PRIVATE KEY BLOCK----- with intact newlines)."
            exit 1
          fi

          KEYID="$(printf '%s\n' "$COLONS"  | awk -F: '$1=="sec"{print $5; exit}')"
          ALGO="$(printf '%s\n'  "$COLONS"  | awk -F: '$1=="sec"{print $4; exit}')"
          CREATED="$(printf '%s\n' "$COLONS"| awk -F: '$1=="sec"{print $6; exit}')"
          EXPIRES="$(printf '%s\n' "$COLONS"| awk -F: '$1=="sec"{print $7; exit}')"
          FPR="$(printf '%s\n'   "$COLONS"  | awk -F: '$1=="fpr"{print $10; exit}')"

          echo "== PUBLIC key metadata =="
          echo "  Key ID (long):  $KEYID"
          echo "  Fingerprint:    $FPR"
          echo "  Pubkey algo id: $ALGO"
          echo "  Created (UTC):  $(date -u -d "@$CREATED" 2>/dev/null || echo "$CREATED")"
          echo "  Owner UID(s):"
          printf '%s\n' "$COLONS" | awk -F: '$1=="uid"{print "    - " $10}'

          # --- Expiration gate ---
          NOW="$(date -u +%s)"
          if [ -n "$EXPIRES" ]; then
            echo "  Expires (UTC):  $(date -u -d "@$EXPIRES" 2>/dev/null || echo "$EXPIRES")"
            if [ "$EXPIRES" -le "$NOW" ]; then
              echo "::error::Signing key is EXPIRED — Maven Central will reject its signatures. Extend the key's expiry and update the GPG_PRIVATE_KEY secret."
              exit 1
            fi
            echo "  Days to expiry: $(( (EXPIRES - NOW) / 86400 ))"
            if [ "$(( (EXPIRES - NOW) / 86400 ))" -lt 30 ]; then
              echo "::warning::Signing key expires in under 30 days — plan to rotate it."
            fi
          else
            echo "  Expires (UTC):  never"
          fi

          # --- Signing-capability gate ---
          if printf '%s\n' "$COLONS" | awk -F: '($1=="sec"||$1=="ssb"){print $12}' | grep -q 's'; then
            echo "  Signing capability: present"
          else
            echo "::error::No signing-capable (sub)key found — this key cannot produce release signatures."
            exit 1
          fi

          # --- Passphrase unlock + sign + verify roundtrip (the exact failure mode) ---
          # Passphrase on fd 3 only. Payload is a throwaway nonce; only the signature's
          # validity (exit codes) matters — no secret is ever emitted.
          echo "== Passphrase unlock + detached-sign + verify self-test =="
          WORK="$(mktemp -d)"
          printf '%s' "ai-index signing-selftest" > "$WORK/payload.txt"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
              --local-user "$KEYID" \
              --detach-sign --armor --output "$WORK/payload.txt.asc" "$WORK/payload.txt" \
              3<<<"${GPG_PASSPHRASE:-}"
          echo "  Signature produced: $(wc -c < "$WORK/payload.txt.asc") armored bytes"
          gpg --batch --verify "$WORK/payload.txt.asc" "$WORK/payload.txt"
          rm -rf "$WORK"

          echo "RESULT: OK — key imports, is not expired, is signing-capable, and the passphrase successfully unlocked it to produce a VALID signature. maven-gpg-plugin will be able to sign with this key/passphrase."

  # ---------------------------------------------------------------------------
  # GPG signing-key preflight — GRADLE / BouncyCastle path.
  # Companion to the `verify-signing-key` (gpg) job above: that one mirrors
  # maven-gpg-plugin (how the Maven artifacts are signed); this one drives
  # Gradle's `signing` plugin + `useInMemoryPgpKeys` (BouncyCastle) — the path any
  # Gradle-based publish (e.g. an Android AAR) uses to sign. BouncyCastle is a
  # STRICTER parser of the armored key than gpg, so it catches key/format problems
  # gpg tolerates (e.g. the primary-vs-signing-subkey null-PGPPrivateKey issue).
  # It signs a throwaway project (.github/signing-selftest/) — no repo build is
  # involved — so this job is IDENTICAL across the sibling repos and validates the
  # release key via the Gradle path even in repos that do not publish via Gradle
  # yet ("prepared for Gradle"). Standalone (no `needs:`), parallel at pipeline
  # start, `environment: maven-central` so it reads the same secret the publish
  # uses. Red-by-design where the secret is not delivered (see the gpg job's note).
  #
  # SECURITY: prints no secret material. Key/passphrase reach Gradle only via env
  # (read by System.getenv at runtime); `set -x` is never enabled; the passphrase
  # is `::add-mask::`ed; Gradle runs with `--stacktrace` only. Only the produced
  # `.asc` (exit code) is asserted. Uses Gradle 9.6.1.
  # ---------------------------------------------------------------------------
  verify-signing-key-gradle:
    name: Verify GPG signing key — Gradle/BouncyCastle path (no secrets printed)
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"
      - name: Sign a throwaway artifact via useInMemoryPgpKeys (BouncyCastle)
        shell: bash
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail   # NOTE: deliberately NO `set -x` — it would echo the passphrase.

          if [ -z "${MAVEN_GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::MAVEN_GPG_PRIVATE_KEY is empty for this run. The maven-central environment did not deliver the secret to this ref (fork PR / other branch). Nothing to verify."
            exit 1
          fi
          if [ -n "${MAVEN_GPG_PASSPHRASE:-}" ]; then echo "::add-mask::${MAVEN_GPG_PASSPHRASE}"; fi

          PROJ=".github/signing-selftest"
          echo "== Sign a throwaway artifact through Gradle's useInMemoryPgpKeys (BouncyCastle) =="
          gradle --no-daemon -p "$PROJ" signMakeArtifact --stacktrace

          ASC="$PROJ/build/signing-selftest.zip.asc"
          if [ -f "$ASC" ]; then
            echo "  Detached signature produced: $(wc -c < "$ASC") armored bytes"
            echo "RESULT: OK — Gradle's useInMemoryPgpKeys accepted the armored key + passphrase and produced a signature."
          else
            echo "::error::Gradle signing produced no .asc — useInMemoryPgpKeys could not build a usable signatory from MAVEN_GPG_PRIVATE_KEY / MAVEN_GPG_PASSPHRASE."
            exit 1
          fi

  code-style:
    name: Code style (spotless) + package graph
    needs: startgate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      # spotless-maven-plugin / spotbugs-maven-plugin are declared only in each child module's own
      # <pluginManagement>/<build> (not the pom-packaging reactor root), so the bare prefix goals
      # (`spotless:check`, `spotbugs:check`) fail with "No plugin found for prefix" — Maven resolves
      # a short prefix against the INVOKING project (the root aggregator here), not the reactor
      # members, regardless of which modules actually end up executing. Using the fully-qualified
      # groupId:artifactId:goal form bypasses prefix resolution entirely (plugin *version* still
      # resolves correctly via each module's inherited pluginManagement pin); -pl restricts
      # execution to the three modules that actually declare the plugin, skipping the parent pom
      # and the source-less relocation stub, neither of which registers it anywhere.
      - name: Spotless check (fail fast on format violations)
        run: mvn -B --no-transfer-progress -pl srcmorph,srcmorph-cli,srcmorph-maven-plugin com.diffplug.spotless:spotless-maven-plugin:check
      - name: SpotBugs check (fail fast on static-analysis findings)
        run: mvn -B --no-transfer-progress -DskipTests -Denforcer.skip=true -pl srcmorph,srcmorph-cli,srcmorph-maven-plugin compile com.github.spotbugs:spotbugs-maven-plugin:check
      - name: Print internal package dependency graph (jdeps, informational)
        continue-on-error: true
        run: |
          mvn -B --no-transfer-progress -DskipTests -Denforcer.skip=true compile
          # Three reactor modules each ship their own module-info.java / target/classes tree
          # (srcmorph, srcmorph-cli, srcmorph-maven-plugin) — print each separately.
          echo "=== internal package dependency graph (jdeps, bytecode) — srcmorph ==="
          jdeps -verbose:package srcmorph/target/classes | grep 'net.ladenthin.srcmorph' || true
          echo "=== internal package dependency graph (jdeps, bytecode) — srcmorph-cli ==="
          jdeps -verbose:package srcmorph-cli/target/classes | grep 'net.ladenthin.srcmorph' || true
          echo "=== internal package dependency graph (jdeps, bytecode) — srcmorph-maven-plugin ==="
          jdeps -verbose:package srcmorph-maven-plugin/target/classes | grep 'net.ladenthin.maven.srcmorph' || true

  build:
    name: Build
    needs: startgate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Build
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-jars
          # All three reactor modules produce their own jars: srcmorph (core library),
          # srcmorph-cli (includes the jar-with-dependencies fat jar — the CLI's deliverable),
          # and srcmorph-maven-plugin (the Maven plugin, renamed from llamacpp-ai-index-maven-plugin
          # in the migration). The former 4th module — a pom-only relocation-stub for the retired
          # coordinates — was published once and then removed from this reactor; see CLAUDE.md.
          path: |
            srcmorph/target/*.jar
            srcmorph-cli/target/*.jar
            srcmorph-maven-plugin/target/*.jar

  test:
    name: Test
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Memory before tests
        run: free -h
      - name: Test
        # Reactor-wide (no -pl): runs every module's tests. The `jcstress` profile is only
        # declared in srcmorph-maven-plugin/pom.xml, so it activates there and is a
        # silent no-op for srcmorph/srcmorph-cli (neither declares a profile with that id).
        #
        # requireNativeLlama turns the model-backed tests' capability check from a skip into a
        # failure. Skipping is right on a developer machine with an unsupported OS/arch; here it
        # would mean a vanished native library or an unchecked-out model quietly restores a green
        # build with zero real inference — the exact shape that let a dead provider ship twice.
        run: >-
          mvn -e --batch-mode --no-transfer-progress -P jcstress
          -Dnet.ladenthin.srcmorph.requireNativeLlama=true verify
      - uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          # srcmorph carries the bulk of the test suite (and the only PIT gate); its report is
          # the one forwarded to Coveralls/Codecov in the `report` job below, matching the
          # single-primary-module precedent already used by the sibling java-llama.cpp reactor
          # (which reports only its `llama` core module, not an aggregate across all modules).
          # srcmorph-cli / srcmorph-maven-plugin jacoco reports are not currently
          # aggregated or uploaded (documented gap, see TODO.md).
          path: srcmorph/target/site/jacoco/jacoco.xml
          if-no-files-found: ignore
      - name: Memory after tests
        if: always()
        run: free -h
      # A forked test JVM that aborts leaves an hs_err_pid log and a surefire
      # dumpstream -- both otherwise ONLY inside the artifact uploaded below,
      # which is unreachable from anywhere that cannot fetch from Azure Blob
      # (a phone, a restricted network, an agent sandbox). Echo them here so the
      # aborting frame is readable from the run page itself. See
      # ../workspace/policies/ci-test-diagnostics.md section 3.1.
      - name: Print crash logs (on failure)
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob globstar
          found=0
          for f in **/hs_err_pid*.log; do
            found=1
            echo "===== $f (first 200 lines; full file in the uploaded artifact) ====="
            sed -n '1,200p' "$f"
          done
          for f in **/target/surefire-reports/*.dumpstream **/target/surefire-reports/*.dump; do
            found=1
            echo "===== $f ====="
            cat "$f"
          done
          if [ "$found" = 0 ]; then
            echo "No hs_err_pid*.log and no surefire dump/dumpstream was written."
            echo
            echo "For an ordinary test failure that is EXPECTED, not a finding: this step runs on"
            echo "any job failure, and an assertion failure, a timeout or a compile error writes no"
            echo "crash log. Read the surefire output above for the real cause."
            echo
            echo "It points at a JVM-level abort only if the log ALSO shows a fork ending abnormally"
            echo "-- 'The forked VM terminated without properly saying goodbye', or an exit with no"
            echo "test results. In that case the abort bypassed the JVM error handler (a native"
            echo "exit()/terminate() rather than a raised signal), which is why no file was written."
          fi
      - name: Upload crash & surefire dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crash-dumps-test
          # Repo-wide glob: a forked surefire JVM crash can happen in any of the three module
          # working directories (srcmorph / srcmorph-cli / srcmorph-maven-plugin), each
          # with its own target/ tree.
          path: |
            ${{ github.workspace }}/**/hs_err_pid*.log
            ${{ github.workspace }}/**/*.hprof
            ${{ github.workspace }}/**/target/surefire-reports/*.dump
            ${{ github.workspace }}/**/target/surefire-reports/*.dumpstream
            ${{ github.workspace }}/**/target/surefire-reports/*.txt
            ${{ github.workspace }}/**/target/surefire-reports/TEST-*.xml
          if-no-files-found: ignore
      - name: Run PIT mutation tests
        # All three modules now carry a pitest-maven execution at mutationThreshold 100, so the
        # goal runs reactor-wide rather than scoped to srcmorph. `-am` is gone with the `-pl`:
        # a plain reactor invocation already builds each module's dependencies in order.
        run: mvn --batch-mode --no-transfer-progress test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Extract PIT survivors
        if: always()
        run: |
          echo "=== PIT Survived Mutations ==="
          for html_file in $(find */target/pit-reports -name "*.html" -type f 2>/dev/null | sort); do
            if grep -q "SURVIVED" "$html_file"; then
              echo "Found survivors in $html_file:"
              grep -B 2 -A 3 "SURVIVED" "$html_file"
              echo ""
            fi
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: pit-reports, path: "*/target/pit-reports/" }

  vmlens:
    name: Test (vmlens interleavings)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { java-version: '21', distribution: temurin, cache: maven }
      - name: Test under vmlens (one class — staged scope)
        # VmlensInterleavingSmokeTest and the `vmlens` profile both live in
        # srcmorph-maven-plugin/pom.xml (they were not relocated during the core
        # extraction — see CLAUDE.md) — scope directly to that module rather than the whole
        # reactor. `-am` is required (not just an optimization): srcmorph is a reactor-local
        # dependency, never published, so without `-am` this module's compile would fail trying
        # to resolve net.ladenthin:srcmorph:1.1.0-SNAPSHOT from a remote repo. That in turn means
        # the `test` phase also runs for srcmorph, where -Dtest=VmlensInterleavingSmokeTest
        # matches no class — `-DfailIfNoTests=false` does NOT suppress that (it only covers "no
        # tests at all"); the actual guard for "the -Dtest pattern matched nothing" is
        # `-Dsurefire.failIfNoSpecifiedTests=false` (verified locally: omitting it fails the
        # build on srcmorph with "No tests matching pattern ... were executed!").
        run: >-
          mvn --batch-mode --no-transfer-progress -pl srcmorph-maven-plugin -am -Pvmlens test
          -Dtest=VmlensInterleavingSmokeTest -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vmlens-report
          path: srcmorph-maven-plugin/target/vmlens-report/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Fat-jar smoke test — cross-repo standard job, kept in the same shape in
  # BitcoinAddressFinder and java-llama.cpp (see workspace/policies/fat-jar-release-assets.md,
  # "No release asset is attached that CI has not run"). The fat jar is a GitHub-Release asset,
  # and unit tests never touch it: they run off target/classes, so an unrunnable uber jar — no
  # Main-Class, a shade-mangled resource, a missing SLF4J binding — is built and GPG-signed
  # without anything noticing. Signing proves who built it, not that it works.
  #
  # srcmorph-specific: config_Plan.json uses the `mock` generation provider, so this needs no
  # GGUF model, no GPU and no network — it is the cheapest possible real launch of the CLI.
  # `Plan` is the command that cannot fail for configuration reasons (planOnly, nothing written);
  # `All` over a real source tree fails by design when files exceed the demo model's context
  # window, which would make the smoke non-deterministic rather than more thorough.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Plugin integration test -- the only job that runs srcmorph-maven-plugin AS A PLUGIN.
  #
  # Every other check on that module calls Java methods directly (PluginArchitectureTest,
  # MojoPhaseSkipTest, MojoConfigurationMappingTest, PIT at 62/62), so nothing covers what only
  # Maven does: plexus binding of the <configuration> XML onto the @Parameter fields, goal-prefix
  # resolution, the srcmorph.* property strings, lifecycle-phase binding, and the descriptor
  # maven-plugin-plugin generates. A renamed @Parameter property shipped green before this job.
  #
  # needs: startgate, not build -- it compiles what it needs itself and consumes no uploaded
  # artifact, so hanging it off build would only serialize it behind a compile it repeats anyway.
  # ---------------------------------------------------------------------------
  plugin-it:
    name: Plugin integration test
    needs: startgate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      # -pl srcmorph-maven-plugin -am resolves to exactly parent + srcmorph + the plugin;
      # srcmorph-cli is a leaf (CliArchitectureTest#cliIsLeaf), so its unconditionally
      # package-bound ~80 MB assembly never runs here. install (not package) because the fixture
      # resolves the plugin from the local repository. The skips drop work code-style and test
      # already do -- keeping them would roughly double the job for no extra signal.
      - name: Install the plugin into the local repository
        run: >
          mvn -B --no-transfer-progress
          -pl srcmorph-maven-plugin -am
          -Dmaven.test.skip=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true
          -Dspotbugs.skip=true -Dspotless.check.skip=true -Denforcer.skip=true -Djacoco.skip=true
          install
      - name: Resolve the reactor version
        id: version
        run: |
          set -euo pipefail
          v=$(sed -n 's|^\s*<version>\(.*\)</version>.*|\1|p' pom.xml | head -1)
          [ -n "$v" ] || { echo "::error::could not read the reactor version from pom.xml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Run the plugin integration test
        run: .github/plugin-it.sh '${{ steps.version.outputs.version }}'
      - name: Upload integration-test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-it-logs
          path: .github/plugin-it/target/logs/*.log
          if-no-files-found: warn

  smoke-fatjar:
    name: Smoke test fat jar
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: plugin-jars
          path: fatjar/
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - name: Run fat-jar smoke test
        run: |
          .github/smoke-fatjar-cli.sh fatjar 'srcmorph-cli-*-jar-with-dependencies.jar' \
            examples 'Main#run end\.' config_Plan.json
      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-fatjar-logs
          path: |
            smoke-out.log
            smoke-err.log
          if-no-files-found: warn

  report:
    name: Report
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { java-version: '21', distribution: temurin }
      # Only srcmorph's jacoco report is uploaded by the `test` job (see the comment there) —
      # it carries the bulk of the test suite and the only PIT gate. Coveralls/Codecov are
      # pointed at it directly rather than an aggregated multi-module report, matching the
      # single-primary-module precedent already used by the sibling java-llama.cpp reactor.
      - uses: actions/download-artifact@v8
        with: { name: jacoco-report, path: srcmorph/target/site/jacoco/ }
        continue-on-error: true
      # Submits the dependency graph to GitHub. Informational: it says nothing about whether the
      # artifacts are correct, but it sits in the `report` job, which the release path needs -- so
      # without this flag a third-party action having a bad day can block a publish.
      - uses: advanced-security/maven-dependency-submission-action@v5
        continue-on-error: true
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: srcmorph/target/site/jacoco/jacoco.xml
          format: jacoco
        continue-on-error: true
      - name: Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: srcmorph/target/site/jacoco/jacoco.xml
        continue-on-error: true

  check-snapshot:
    name: "Check: main branch / SNAPSHOT"
    needs: [report]
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Confirm snapshot ref
        run: echo "Confirmed on snapshot ref ${{ github.ref }}"

  check-tag:
    name: "Check: v* tag"
    needs: [report]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Confirm tag ref
        run: echo "Confirmed on tag ${{ github.ref }}"

  publish-snapshot:
    name: Publish Snapshot to Central
    needs: [check-snapshot, code-style, smoke-fatjar, plugin-it]
    if: needs.check-snapshot.result == 'success' && inputs.publish_to_central
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Guard - require a -SNAPSHOT version
        shell: bash
        run: |
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version | tail -n1)
          echo "Resolved project version: $VERSION"
          case "$VERSION" in
            *-SNAPSHOT) echo "OK: -SNAPSHOT version, continuing snapshot deploy." ;;
            *) echo "::error::Refusing to publish non-SNAPSHOT version '$VERSION' from the snapshot job. Snapshot publishing requires a -SNAPSHOT version; releases go through the v* tag path."; exit 1 ;;
          esac
      # Informational only (nothing depends on it): logs the effective POM with the same
      # profile as the deploy below, so the resolved central-publishing configuration
      # (waitUntil/waitMaxTime etc.) is visible for debugging.
      - name: Show effective POM (debug)
        run: mvn --batch-mode --no-transfer-progress -P release help:effective-pom
      - name: Deploy snapshot
        run: mvn --batch-mode --no-transfer-progress -P release deploy -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      # Runs even when the deploy step failed: a Central publish-poll timeout reds the
      # job *after* the bundle was uploaded (and typically published server-side), while
      # the signed jars + .asc files already exist in each module's target/ (signing happens at
      # verify). Collecting on failure lets the github-snapshot job still attach them.
      # NOTE: the fat jar (jar-with-dependencies) is EXCLUDED here — it is no longer attached/
      # deployed to Central (srcmorph-cli/pom.xml sets <attach>false</attach>), so it is unsigned
      # in target/ at this point. It is built + signed + collected by the next step instead. This
      # step runs BEFORE that one so the deploy-signed plain/sources/javadoc jars are captured
      # before the classifier loop rebuilds (and clobbers) srcmorph-cli/target.
      - name: Collect signed Central artifacts (plain/sources/javadoc; fat jars handled next)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p signed-snapshot-assets
          for m in srcmorph srcmorph-cli srcmorph-maven-plugin; do
            for f in "$m"/target/*.jar "$m"/target/*.jar.asc; do
              [ -e "$f" ] || continue
              case "$f" in *-jar-with-dependencies.jar|*-jar-with-dependencies.jar.asc) continue ;; esac
              cp "$f" signed-snapshot-assets/
            done
          done
      # Build one srcmorph-cli fat jar per net.ladenthin:llama native classifier + the default
      # all-platform CPU fat jar, GPG-sign each, and add them to the GitHub-Release assets. These
      # are GitHub-only (never Maven Central): each bundles exactly one llama native binary, so a
      # GPU jar runs only on its own OS/arch/backend, while the default (no classifier) bundles the
      # multi-platform CPU natives and runs anywhere. Signing uses the key setup-java already
      # imported (armored detached .asc, same shape Central produces).
      - name: Build, sign & verify classifier fat jars (GitHub-only assets, never Central)
        if: ${{ !cancelled() }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Source of truth: the <classifier> set in java-llama.cpp llama/pom.xml for the pinned
          # ${llama.version} (all published to Maven Central). Keep in sync on a llama bump.
          CLASSIFIERS=(
            cuda13-linux-x86-64 cuda13-windows-x86-64
            vulkan-linux-x86-64 vulkan-linux-aarch64 vulkan-windows-x86-64
            opencl-windows-x86-64 opencl-windows-aarch64 opencl-android-aarch64
            rocm-linux-x86-64 rocm-windows-x86-64
            sycl-fp16-linux-x86-64 sycl-fp32-linux-x86-64 sycl-windows-x86-64
            openvino-linux-x86-64 openvino-windows-x86-64
            msvc-windows
          )
          build() { mvn -B --no-transfer-progress -pl srcmorph-cli -am -DskipTests -Dmaven.javadoc.skip=true -Dllama.classifier="$1" package; }
          for c in "${CLASSIFIERS[@]}"; do
            build "$c"
            f=$(ls srcmorph-cli/target/srcmorph-cli-*-jar-with-dependencies.jar)
            cp "$f" "${f%.jar}-${c}.jar"
          done
          # default CPU build LAST so the unsuffixed fat jar is the all-platform CPU variant
          build ""
          # Collect every fat jar variant, then GPG-sign each via the cross-repo shared script
          # (.github/sign-fatjars.sh, byte-identical with java-llama.cpp) — a .asc per fat jar.
          cp srcmorph-cli/target/srcmorph-cli-*-jar-with-dependencies*.jar signed-snapshot-assets/
          bash .github/sign-fatjars.sh signed-snapshot-assets
          # Structural check of what the loop just produced. The smoke-fatjar job LAUNCHES the
          # default jar; the sixteen GPU jars cannot be covered that way (a GitHub runner has no
          # such device, and the only command that would load the native library is a real
          # generation), so this asserts instead that each jar is the artifact its name claims --
          # one jar per classifier, a native for the OS/arch the name promises, and a native set
          # that DIFFERS from the default jar's. That last one is the point: if -Dllama.classifier=
          # ever stops being wired through, the loop silently ships sixteen copies of the CPU build
          # under GPU names and nothing else in this pipeline notices.
          bash .github/verify-classifier-fatjars.sh signed-snapshot-assets "${CLASSIFIERS[@]}"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: signed-snapshot-assets
          path: signed-snapshot-assets/

  github-snapshot:
    name: Update Snapshot Pre-release on GitHub
    needs: [publish-snapshot]
    # Also runs when publish-snapshot FAILED (not when skipped/cancelled): a Central
    # publish-poll timeout reds that job after the artifacts were already uploaded —
    # the GitHub pre-release assets must not be lost in that case.
    if: ${{ !cancelled() && (needs.publish-snapshot.result == 'success' || needs.publish-snapshot.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: signed-snapshot-assets
          path: snapshot-assets/
      - name: Report unsigned assets (does not block the upload)
        # Deliberately NON-blocking, and deliberately BEFORE the upload. Both attach jobs run even
        # when their publish job failed, because a Central publish-poll timeout must not cost the
        # GitHub assets: if Central is unreachable these are the ONLY way to get the artifacts at
        # all. Refusing to attach on a signing failure would defeat exactly that. So annotate here,
        # upload regardless, and fail the job afterwards. Assets always land; an unsigned release is
        # still loudly red rather than quietly wrong.
        # See workspace/policies/fat-jar-release-assets.md, "Attach first, then go red".
        id: signatures
        run: |
          set -uo pipefail
          dir="snapshot-assets"
          jars=$(find "$dir" -maxdepth 1 -name '*.jar' | sort)
          if [ -z "$jars" ]; then
            echo "::error::no jars in $dir -- the collection step produced nothing"
            echo "missing=-1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=0
          for jar in $jars; do
            if [ ! -e "$jar.asc" ]; then
              echo "::error::unsigned: $(basename "$jar") has no detached .asc"
              missing=$((missing + 1))
            fi
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          [ "$missing" -eq 0 ] && echo "all $(echo "$jars" | wc -l) jar(s) signed"
          exit 0
      - name: Update snapshot pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view snapshot --repo ${{ github.repository }} 2>/dev/null \
            || gh release create snapshot \
                 --repo ${{ github.repository }} \
                 --prerelease \
                 --title "Snapshot (latest)" \
                 --notes "Latest snapshot build from the main branch."
          gh release upload snapshot snapshot-assets/* \
            --repo ${{ github.repository }} \
            --clobber
      - name: Fail if anything was attached unsigned
        # After the upload on purpose: the assets must exist even when the signature does not.
        if: ${{ always() && steps.signatures.outputs.missing != '0' }}
        run: |
          echo "::error::${{ steps.signatures.outputs.missing }} asset(s) attached without a signature (-1 means none were collected at all)"
          exit 1

